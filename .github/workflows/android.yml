name: Android CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Android SEJATI MAPS
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode sumber repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siapkan Java JDK 21 (wajib untuk Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gunakan Android SDK bawaan runner GitHub
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Direktori Android SDK tidak ditemukan di $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

          if [ -d "$SDK_ROOT/platforms/android-36" ] && [ -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Android SDK Platform 36 dan Build Tools 36.0.0 sudah tersedia."
            exit 0
          fi

          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            if [ -w "$SDK_ROOT" ]; then
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            elif command -v sudo >/dev/null 2>&1; then
              yes | sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
              sudo "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            else
              echo "Mengandalkan auto-download Gradle untuk komponen SDK yang kurang."
            fi
          else
            echo "sdkmanager tidak dieksekusi langsung; Gradle akan menggunakan SDK yang tersedia."
          fi

      - name: Pasang dependensi npm
        run: npm install

      - name: Periksa tipe TypeScript
        run: npm run lint

      - name: Validasi & bangun aset web produksi (Vite)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
        run: |
          if [ -n "$VITE_API_BASE_URL" ]; then
            if echo "$VITE_API_BASE_URL" | grep -qiE 'localhost|127\.0\.0\.1|10\.0\.2\.2|ais-dev-|ais-pre-'; then
              echo "ERROR: VITE_API_BASE_URL tidak boleh memakai localhost atau alamat preview AI Studio untuk APK production."
              exit 1
            fi
            echo "VITE_API_BASE_URL terkonfigurasi untuk build APK production."
          else
            echo "PERINGATAN: VITE_API_BASE_URL belum diisi di GitHub Actions Variables/Secrets. APK akan memakai katalog bawaan hingga URL API hosting diisi."
          fi
          npm run build

      - name: Sinkronkan proyek Capacitor Android
        run: npx cap sync android

      - name: Build APK Android menggunakan Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verifikasi hasil file APK
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: File APK tidak ditemukan di $APK_SRC"
            exit 1
          fi
          mkdir -p release-apk
          cp "$APK_SRC" release-apk/SEJATI-MAPS-android.apk
          ls -lh release-apk/SEJATI-MAPS-android.apk

      - name: Upload APK ke GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEJATI-MAPS-Android-APK
          path: release-apk/SEJATI-MAPS-android.apk
          if-no-files-found: error
          retention-days: 90

      - name: Tentukan tag GitHub Release
        if: github.event_name != 'pull_request'
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=SEJATI MAPS Android ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=apk-latest" >> "$GITHUB_OUTPUT"
            echo "title=SEJATI MAPS Android APK (Terbaru)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publikasikan APK ke GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: |
            File APK Android resmi untuk aplikasi **SEJATI MAPS** (Kuliner & Peta GIS Kota Pangkal Pinang).

            **Cara Pasang di HP Android:**
            1. Unduh file `SEJATI-MAPS-android.apk` di bawah ini langsung dari browser HP.
            2. Buka file APK yang selesai diunduh.
            3. Jika diminta izin, aktifkan **Izinkan dari sumber ini**, lalu ketuk **Instal**.
          make_latest: true
          files: |
            release-apk/SEJATI-MAPS-android.apk
